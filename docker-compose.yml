services:
  postgres:
    image: postgres:17-alpine          # pinned major version: upgrading means dump + restore
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragchat_dev}
      POSTGRES_DB: ragchat
    ports:
      - "127.0.0.1:5432:5432"          # localhost only (psql, no-Docker dev mode). Port taken? use "5433:5432" on the left
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql://rag:${POSTGRES_PASSWORD:-ragchat_dev}@postgres:5432/ragchat
      - FASTEMBED_CACHE_PATH=/models
      - RERANK_MODEL=BAAI/bge-reranker-v2-m3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-cache:/models
    depends_on:
      postgres:
        condition: service_healthy     # wait until Postgres actually accepts connections
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  qdrant-data:
  model-cache: