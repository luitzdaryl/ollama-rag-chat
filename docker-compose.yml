services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # localhost only: handy for the dashboard and for running the backend outside Docker
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FASTEMBED_CACHE_PATH=/models
      - RERANK_MODEL=BAAI/bge-reranker-v2-m3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-cache:/models
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  qdrant-data:
  model-cache: