server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. Resolving "backend" on each request (instead of once at
    # startup) keeps nginx working after the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep this >= MAX_UPLOAD_MB on the backend (default 100), so an oversized upload
    # gets the backend's readable message instead of nginx's HTML error page.
    client_max_body_size 200m;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;          # no URI part: the request path is passed through unchanged

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamed responses (chat tokens, upload progress) must reach the browser as they happen
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # A slow first token or a long generation must not be cut off (nginx's default is 60s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite's build gives these files content-hashed names, so they can be cached for a year
    location /assets/ {
        gzip on;
        gzip_types text/css text/javascript application/javascript image/svg+xml;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app itself. Unknown paths fall back to index.html, which the upcoming
    # /verify-email and /reset-password links will need.
    location / {
        gzip on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}